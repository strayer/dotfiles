schemaVersion: "2"
kind: mixin
name: prek
displayName: prek (pre-commit in Rust)
description: Installs the prek CLI so the agent can run pre-commit hooks (https://prek.j178.dev).
sourceURL: https://github.com/j178/prek
agentInstructions:
  content: |
    ## prek
    This sandbox has prek installed, a drop-in replacement for pre-commit.
    Use `prek run -a` to run hooks from .pre-commit-config.yaml; hook
    environments are created on first use.
permissions:
  network:
    allow:
      # Hook repos are cloned from GitHub at runtime; release downloads
      # redirect to the objects/release-assets hosts (same set the
      # sbx-kits-contrib mise kit uses and documents).
      - github.com
      - api.github.com
      - objects.githubusercontent.com
      - release-assets.githubusercontent.com
      # Python-based hooks: prek bootstraps environments via uv. Hooks in
      # other ecosystems (node, go, ...) need their registries added here.
      - pypi.org
      - files.pythonhosted.org
      - astral.sh
setup:
  install:
    # Pinned, digest-verified release binary (musl build, so it works
    # regardless of the sandbox base image). To bump: change PREK_VERSION
    # and the per-arch SHA256 from the release's *.sha256 assets.
    - command: |
        set -euo pipefail
        PREK_VERSION=0.4.14
        ARCH=$(dpkg --print-architecture)
        case "$ARCH" in
          amd64) TRIPLE="x86_64-unknown-linux-musl"
                 SHA256="388f2e5216684c22e635dc1bde1bac5bd008a5dfc21c754ced382d19ff31413b" ;;
          arm64) TRIPLE="aarch64-unknown-linux-musl"
                 SHA256="27a873abf78df8ec842829f6def4356f1f10c8ddf1741c6b2b3ba0c1e1e93f95" ;;
          *) echo "unsupported arch: $ARCH" >&2; exit 1 ;;
        esac
        URL="https://github.com/j178/prek/releases/download/v${PREK_VERSION}/prek-${TRIPLE}.tar.gz"
        curl --proto '=https' --tlsv1.2 -fsSL -o /tmp/prek.tgz "$URL"
        echo "${SHA256}  /tmp/prek.tgz" | sha256sum -c -
        tar -C /tmp -xzf /tmp/prek.tgz "prek-${TRIPLE}/prek"
        install -m 0755 "/tmp/prek-${TRIPLE}/prek" /usr/local/bin/prek
        rm -rf "/tmp/prek-${TRIPLE}" /tmp/prek.tgz
        prek --version
      user: "0"
      description: "Install prek v0.4.14, version+digest pinned"
